<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered career guidance with transparent SHAP explainability. Predict your ideal career path using XGBoost machine learning.">
    <title>{% block title %}Career Predictor | SHAP-Driven Explainable AI{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ─── Design Tokens ────────────────────────────────────── */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-tertiary: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.95);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --gradient-primary: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --gradient-hero: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #06b6d4 100%);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.1);
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── Animated Background ──────────────────────────────── */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0; pointer-events: none;
        }
        .bg-glow-1, .bg-glow-2 {
            position: fixed; border-radius: 50%; filter: blur(120px);
            z-index: 0; pointer-events: none; opacity: 0.4;
        }
        .bg-glow-1 {
            width: 600px; height: 600px; top: -200px; right: -100px;
            background: radial-gradient(circle, rgba(59,130,246,0.3), transparent 70%);
            animation: floatGlow 15s ease-in-out infinite;
        }
        .bg-glow-2 {
            width: 500px; height: 500px; bottom: -150px; left: -100px;
            background: radial-gradient(circle, rgba(139,92,246,0.25), transparent 70%);
            animation: floatGlow 18s ease-in-out infinite reverse;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* ─── Navigation ───────────────────────────────────────── */
        .navbar-custom {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.75rem 0;
            transition: var(--transition-smooth);
        }
        .navbar-custom .navbar-brand {
            font-weight: 800; font-size: 1.25rem; letter-spacing: -0.5px;
            background: var(--gradient-primary);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .navbar-custom .navbar-brand img {
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }
        .navbar-custom .nav-link {
            color: var(--text-secondary) !important;
            font-weight: 500; font-size: 0.9rem;
            padding: 0.5rem 1rem !important;
            border-radius: var(--radius-sm);
            transition: var(--transition-smooth);
            position: relative;
        }
        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: var(--text-primary) !important;
            background: rgba(59, 130, 246, 0.08);
        }
        .navbar-custom .nav-link.active::after {
            content: '';
            position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 2px;
            background: var(--gradient-primary); border-radius: 2px;
        }
        .navbar-toggler {
            border: 1px solid var(--glass-border); padding: 0.4rem 0.6rem;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%2815, 23, 42, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* ─── Glass Cards ──────────────────────────────────────── */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2rem;
            transition: var(--transition-smooth);
            animation: fadeSlideUp 0.6s ease-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.2);
            box-shadow: var(--shadow-glow);
            transform: translateY(-4px);
        }
        .glass-card-static {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* ─── Buttons ──────────────────────────────────────────── */
        .btn-glow {
            background: var(--gradient-primary);
            border: none; color: #fff; font-weight: 600;
            padding: 0.85rem 2.2rem; border-radius: var(--radius-md);
            transition: var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            position: relative; overflow: hidden;
        }
        .btn-glow::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            color: #fff;
        }
        .btn-glow:hover::before { opacity: 1; }

        .btn-outline-glass {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary); font-weight: 500;
            padding: 0.75rem 1.8rem; border-radius: var(--radius-md);
            transition: var(--transition-smooth);
        }
        .btn-outline-glass:hover {
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(59, 130, 246, 0.05);
            color: var(--accent-blue);
        }

        /* ─── Form Controls ────────────────────────────────────── */
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }
        .form-control:focus, .form-select:focus {
            background: #ffffff;
            border-color: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-label {
            color: var(--text-secondary);
            font-weight: 600; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .form-select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ─── Pills / Tags ─────────────────────────────────────── */
        .tech-pill {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.4rem 1rem;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 100px;
            color: var(--accent-blue);
            font-size: 0.8rem; font-weight: 500;
            transition: var(--transition-smooth);
        }
        .tech-pill:hover {
            background: rgba(59, 130, 246, 0.15);
            transform: translateY(-1px);
        }
        .tech-pill.purple {
            background: rgba(139, 92, 246, 0.08);
            border-color: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
        }
        .tech-pill.cyan {
            background: rgba(6, 182, 212, 0.08);
            border-color: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
        }
        .tech-pill.green {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        /* ─── Section Headings ─────────────────────────────────── */
        .section-label {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--accent-blue);
            margin-bottom: 1rem;
        }
        .section-label::before {
            content: ''; width: 8px; height: 8px;
            background: var(--gradient-primary);
            border-radius: 50%;
        }
        .gradient-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── Footer ───────────────────────────────────────────── */
        footer {
            margin-top: auto;
            padding: 3rem 0;
            background: rgba(6, 8, 15, 0.95);
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative; z-index: 1;
        }

        /* ─── Animations ───────────────────────────────────────── */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* ─── Utility ──────────────────────────────────────────── */
        .content-wrapper { position: relative; z-index: 1; }
        .text-accent { color: var(--accent-blue); }

        /* ─── Responsive ───────────────────────────────────────── */
        @media (max-width: 768px) {
            .glass-card { padding: 1.25rem; border-radius: var(--radius-lg); }
            .btn-glow { padding: 0.75rem 1.5rem; width: 100%; }
            .bg-glow-1, .bg-glow-2 { opacity: 0.2; }
            h1 { font-size: 2rem !important; }
            h2 { font-size: 1.5rem !important; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-grid"></div>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Navigation -->
    <nav class="navbar-custom navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                <img src="{% static 'logo.png' %}" alt="Logo" width="36" height="36">
                <span>CAREER AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
                           href="{% url 'index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'predict' %}active{% endif %}"
                           href="{% url 'predict' %}">Predict</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'analysis' %}active{% endif %}"
                           href="{% url 'analysis' %}">Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'compare' %}active{% endif %}"
                           href="{% url 'compare' %}">
                            Compare Models
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                           href="{% url 'about' %}">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="content-wrapper flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-1">&copy; 2026 Career Predictor &mdash; Explainable AI for Localized Career Guidance</p>
            <p class="mb-0" style="color: var(--text-muted);">Powered by XGBoost &amp; SHAP</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
