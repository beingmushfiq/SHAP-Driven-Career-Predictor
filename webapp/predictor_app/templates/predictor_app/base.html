<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Career Predictor | SHAP Analysis{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --container-padding: 2rem;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent-color) !important;
        }

        .nav-link {
            color: var(--text-secondary) !important;
            transition: all 0.3s ease;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            border-radius: 8px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-color) !important;
            background: rgba(37, 99, 235, 0.05);
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: var(--container-padding);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.6s ease-out;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .btn-primary {
            background: var(--accent-gradient);
            border: none;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.3);
            color: white;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            :root {
                --container-padding: 1.5rem;
            }
            .display-3 { font-size: 2.5rem; }
            .display-5 { font-size: 2rem; }
            .navbar { padding: 0.5rem 0; }
            .btn-lg { width: 100%; padding: 0.8rem 1.5rem; }
            .glass-card { padding: 1.25rem; }
        }

        footer {
            margin-top: auto;
            padding: 4rem 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        /* Custom Form Styling */
        .form-control, .form-select {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            background: #ffffff;
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-label {
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        /* Checkbox Select Multiple Styling */
        .form-check {
            display: flex;
            align-items: center;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 0.6rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            cursor: pointer;
            position: relative;
        }

        .form-check:hover {
            border-color: var(--accent-color);
            background: rgba(37, 99, 235, 0.02);
            transform: translateX(4px);
        }

        .form-check-input {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 1rem;
            cursor: pointer;
            border: 2px solid var(--border-color);
        }

        .form-check-input:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .form-check-label {
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 0;
            display: block;
        }

        .form-check-input:checked ~ .form-check-label {
            color: var(--accent-color);
            font-weight: 600;
        }

        .options-container {
            background: rgba(0, 0, 0, 0.02);
            padding: 1rem;
            border-radius: 12px;
            border: 1px inset rgba(0, 0, 0, 0.05);
            max-height: 250px;
            overflow-y: auto;
        }

        .options-container::-webkit-scrollbar {
            width: 5px;
        }

        /* Select2 Premium Styling */
        .select2-container--default .select2-selection--single {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            height: 48px;
            display: flex;
            align-items: center;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text-primary);
            line-height: 48px;
            padding-left: 1rem;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 46px;
        }

        .select2-dropdown {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .select2-results__option--highlighted[aria-selected] {
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--accent-color);
        }

        .select2-results__option {
            padding: 0.75rem 1rem;
            color: var(--text-primary);
        }

        .text-info { color: var(--accent-color) !important; }
        .bg-info { background-color: var(--accent-color) !important; color: white !important; }
        .border-info { border-color: var(--accent-color) !important; }
        .text-secondary { color: var(--text-secondary) !important; }
        .btn-outline-light {
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .btn-outline-light:hover {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'index' %}">
                <img src="{% static 'logo.png' %}" alt="Logo" width="40" height="40" class="me-2 rounded-circle">
                <span>CAREER AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'predict' %}active{% endif %}" href="{% url 'predict' %}">Predict</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'analysis' %}active{% endif %}" href="{% url 'analysis' %}">Global Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center">
        <div class="container">
            <p>&copy; 2026 Career Predictor - Explainable AI for Localized Career Guidance</p>
            <p class="mb-0">Powered by XGBoost & SHAP</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            function formatState (state) {
                if (!state.id) {
                    return state.text;
                }
                var isSelected = $(state.element).prop('selected');
                var $state = $(
                    '<span>' + state.text + (isSelected ? ' <span class="ms-2 text-primary">✓</span>' : '') + '</span>'
                );
                return $state;
            };

            $('.select-ticked-multi').select2({
                templateResult: formatState,
                templateSelection: function(state) {
                    return state.text;
                },
                width: '100%',
                dropdownAutoWidth: true,
                placeholder: "Select one or more options...",
                allowClear: true,
                closeOnSelect: false
            });
        });
    </script>
    <style>
        /* Select2 Multi-select Pill Styling */
        .select2-container--default .select2-selection--multiple {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 5px;
            min-height: 48px;
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            color: var(--accent-color);
            border-radius: 6px;
            padding: 2px 10px;
            font-weight: 500;
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            color: var(--accent-color);
            margin-right: 5px;
        }
    </style>
    {% block extra_js %}{% endblock %}
</body>
</html>
