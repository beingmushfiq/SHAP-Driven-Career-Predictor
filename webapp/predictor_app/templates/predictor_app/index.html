{% extends 'predictor_app/base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center text-center" style="min-height: calc(100vh - 200px);">
    
    <div class="glass-card p-5" style="max-width: 800px; width: 100%;">
        
        <!-- Tech Pills -->
        <div class="d-flex flex-wrap justify-content-center gap-3 mb-4 delay-1" style="animation: fadeSlideUp 0.8s ease-out;">
            <span class="tech-pill purple">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                XGBoost
            </span>
            <span class="tech-pill cyan">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                SHAP Explanation
            </span>
            <span class="tech-pill green">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                Explainable AI
            </span>
            <span class="tech-pill text-accent">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                Career Intelligence
            </span>
        </div>

        <!-- Headings -->
        <h1 class="display-4 fw-black mb-3 delay-2 gradient-text" style="animation: fadeSlideUp 1s ease-out; font-weight: 900; letter-spacing: -1px;">
            Predict Your Future<br>with Machine Learning
        </h1>
        
        <p class="lead text-secondary mb-5 delay-3" style="animation: fadeSlideUp 1.2s ease-out; max-width: 600px; margin: 0 auto; font-size: 1.15rem;">
            AI-powered career guidance with transparent SHAP explainability.
        </p>

        <!-- CTA -->
        <div class="delay-4" style="animation: fadeSlideUp 1.4s ease-out;">
            <a href="{% url 'predict' %}" class="btn btn-glow btn-lg px-5 py-3 fs-5" style="border-radius: 100px;">
                Get Started
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" class="ms-2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
            </a>
        </div>
        
    </div>
</div>
{% endblock %}
